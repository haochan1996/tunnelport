# 发布流水线：私有仓构建 → 推 Release 到公开仓（haochan1996/tunnelport）
# 需要的 secret：RELEASE_TOKEN（对公开仓有 contents:write 的 PAT，配置见 README）

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... 
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/tp_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}" ./cmd/tp
      - uses: actions/upload-artifact@v4
        with:
          name: tp-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum tp_* tunnelport_* | tee SHA256SUMS
      # 注意：rathole 自构建（D-1）在 W1.5 接入；当前资产只含 tp，
      # 安装脚本先要求用户自备 rathole 或从上游下载（scripts/fetch-rathole.*）。
      - name: Publish to public repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          files: dist/*
