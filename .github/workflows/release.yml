# 发布流水线：tag → 单元测试 → 多平台构建（命令行 + 桌面 GUI）→ Release + ghcr 镜像
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Embed Windows resources (VERSIONINFO + icon)
        if: matrix.os == 'windows'
        run: |
          VER=${GITHUB_REF_NAME#v}  # 版本资源与 tag 自动同步
          sed -i "s/[0-9]\+\.[0-9]\+\.[0-9]\+/$VER/g" cmd/tp/winres/winres.json cmd/tp-app/winres/winres.json
          go run github.com/tc-hib/go-winres@latest make --in cmd/tp/winres/winres.json --arch ${{ matrix.arch }} --out cmd/tp/winres.syso
          go run github.com/tc-hib/go-winres@latest make --in cmd/tp-app/winres/winres.json --arch ${{ matrix.arch }} --out cmd/tp-app/winres.syso
          mv cmd/tp/winres.syso_windows_${{ matrix.arch }}.syso cmd/tp/winres.syso
          mv cmd/tp-app/winres.syso_windows_${{ matrix.arch }}.syso cmd/tp-app/winres.syso
      - name: Build CLI + Desktop GUI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/tp_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}" ./cmd/tp
          # Windows 桌面端必须 -H windowsgui：否则是控制台子系统，启动带常驻终端窗口
          GUIFLAGS="-s -w -X main.version=${GITHUB_REF_NAME}"
          if [ "${{ matrix.os }}" = "windows" ]; then GUIFLAGS="$GUIFLAGS -H windowsgui"; fi
          go build -trimpath -ldflags "$GUIFLAGS" \
            -o "dist/tunnelport_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}" ./cmd/tp-app
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build tp-linux (amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o docker/tp-linux ./cmd/tp
      - name: Fetch rathole (逃生舱，可选引擎)
        run: |
          curl -sL -o rh.zip "https://github.com/rathole-org/rathole/releases/download/v0.5.0/rathole-x86_64-unknown-linux-gnu.zip" \
            || curl -sL -o rh.zip "https://gh-proxy.com/https://github.com/rathole-org/rathole/releases/download/v0.5.0/rathole-x86_64-unknown-linux-gnu.zip"
          unzip -o -q rh.zip -d docker/ && rm rh.zip
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  # SignPath 开源签名（docs/SIGNING.md）：配好 SIGNPATH_* secrets 后自动启用
  sign:
    needs: build
    runs-on: ubuntu-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      # 只取构建产物：全量 merge-multiple 会与自传构件同名解压冲突（瞬态故障根因）
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: bin-*
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: unsigned-windows
          path: dist/*windows*
      - name: Submit to SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Upload signed artifacts
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: signed/

  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      # 只取构建产物：unsigned-windows 与 bin-windows-* 同名文件会在 merge-multiple 解压冲突
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: bin-*
      # 签名产物（未配 SignPath 时不存在，忽略）
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: signed
          merge-multiple: true
          pattern: signed-windows
      - name: Prefer signed Windows binaries
        run: |
          if [ -d signed ]; then cp -f signed/* dist/ 2>/dev/null || true; fi
          ls dist/
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 该下哪个文件？

            | 文件 | 用途 |
            |---|---|
            | `tunnelport_windows_amd64.exe` | **桌面图形界面（Windows）——大多数用户下这个** |
            | `tunnelport_darwin_arm64` / `tunnelport_darwin_amd64` | 桌面图形界面（macOS Apple 芯片 / Intel） |
            | `tunnelport_linux_amd64` / `tunnelport_linux_arm64` | 桌面图形界面（Linux） |
            | `tp_windows_amd64.exe` / `tp_*` | 命令行工具（服务器 `tp serve`、诊断 `tp doctor`）——需在终端运行，双击无效 |
          files: dist/*
